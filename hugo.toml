baseURL = "https://muhanli.ca/"
title = "Muhan Li"
locale = "en-us"
enableRobotsTXT = true

# No tags/categories — keep output to pages only
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[params]
  description = "Muhan Li — software engineer based in Vancouver, BC."

# Nav items are declared in content frontmatter and in the menu below.
# To add a section later (e.g. photography), copy that pattern.

[[menus.main]]
  name = "experience"
  identifier = "experience"
  url = "/experience/"
  weight = 2

[[menus.main]]
  name = "projects"
  identifier = "projects"
  url = "/projects/"
  weight = 3

[markup]
  [markup.highlight]
    style = "friendly"
    lineNos = true
    lineNumbersInTable = false
    codeFences = true
