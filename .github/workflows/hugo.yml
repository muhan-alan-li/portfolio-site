name: Deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest

      # Keep the CLI repository as the single source for installer scripts.
      # A site deployment (or manual workflow run) refreshes both public URLs.
      - name: Fetch CLI installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer_ref=$(gh api repos/muhan-alan-li/muhancli/releases/latest --jq .tag_name)
          for script in install.sh install.ps1; do
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
              "https://raw.githubusercontent.com/muhan-alan-li/muhancli/$installer_ref/$script" \
              -o "static/$script"
          done
          sh -n static/install.sh
          echo "Installer source: $installer_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: hugo

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
